<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Grid</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 22px 50px;
            font-family: Arial, sans-serif;
            background-color: #f7f5ff;
        }


        /* GRID PARENT */

        .parentbox {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }


        /* MOVIE CARD */

        .movie-cart {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 16px;
            overflow: hidden;

            display: flex;
            flex-direction: column;

            opacity: 0;
            transform: translateY(50px);

            animation: cardUp 0.8s ease forwards;
        }


        /* IMAGE */

        .movie-cart img {
            width: 100%;
            height: 260px;
            object-fit: contain;
            display: block;
        }


        /* MOVIE INFO */

        .movie-info {
            padding: 14px 12px;

            display: flex;
            flex-direction: column;

            flex: 1;
        }

        .movie-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .movie-details {
            font-size: 14px;
            color: #555;
        }


        /* BOOK NOW BUTTON */

        .book-btn {
            width: 100px;
            padding: 8px 10px;

            margin-top: auto;

            border: none;
            border-radius: 6px;

            background-color: black;
            color: white;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .book-btn:hover {
            background-color: #333;
            transform: translateY(-2px);
        }


        /* CARD ANIMATION */

        @keyframes cardUp {

            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ANIMATION DELAY */

        .movie-cart:nth-child(1) {
            animation-delay: 0s;
        }

        .movie-cart:nth-child(2) {
            animation-delay: 0.2s;
        }

        .movie-cart:nth-child(3) {
            animation-delay: 0.4s;
        }

        .movie-cart:nth-child(4) {
            animation-delay: 0.6s;
        }

    </style>
</head>


<body>

    <div class="parentbox">


        <!-- MOVIE 1 -->

        <div class="movie-cart">

            <img src="https://cdn.district.in/movies-assets/images/cinema/Hanuman-Ansh-3199a900-6975-11f1-a51b-91d242246b61.jpg"
                 alt="Hanuman Ansh">

            <div class="movie-info">

                <div class="movie-name">
                    Hanuman Ansh
                </div>

                <div class="movie-details">
                    U | Hindi
                </div>

                <button class="book-btn">
                    Book Now
                </button>

            </div>

        </div>


        <!-- MOVIE 2 -->

        <div class="movie-cart">

            <img src="https://cdn.district.in/movies-assets/images/cinema/_Poster-d0d78f60-961a-11f1-8483-eb84b060bac3.jpg"
                 alt="Mirzapur The Movie">

            <div class="movie-info">

                <div class="movie-name">
                    Mirzapur: The Movie
                </div>

                <div class="movie-details">
                    A | Hindi
                </div>

                <button class="book-btn">
                    Book Now
                </button>

            </div>

        </div>


        <!-- MOVIE 3 -->

        <div class="movie-cart">

            <img src="https://cdn.district.in/movies-assets/images/cinema/_Poster%20(28)-208bf360-ac06-11f1-917e-0d151330b8ad.jpg"
                 alt="Haiwaan">

            <div class="movie-info">

                <div class="movie-name">
                    Haiwaan
                </div>

                <div class="movie-details">
                    UA16+ | Hindi
                </div>

                <button class="book-btn">
                    Book Now
                </button>

            </div>

        </div>


        <!-- MOVIE 4 -->

        <div class="movie-cart">

            <img src="https://cdn.district.in/movies-assets/images/cinema/toxiv%3Dc-8340c900-9c6f-11f1-97d4-73a32236137e.jpg"
                 alt="Toxic">

            <div class="movie-info">

                <div class="movie-name">
                    Toxic: A Fairy Tale for Grown-ups
                </div>

                <div class="movie-details">
                    A | Hindi
                </div>

                <button class="book-btn">
                    Book Now
                </button>

            </div>

        </div>


    </div>

</body>
